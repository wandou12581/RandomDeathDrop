plugins {
    id 'net.fabricmc.fabric-loom-remap' version "1.17.19"
    id 'maven-publish'
}

group = 'com.halfdrop'
version = '1.5.0'

base {
    archivesName = 'RandomDeathDrop-fabric'
}

// shared sources: compile common/ into this jar directly
sourceSets.main.java.srcDirs += ['../common/src/main/java']

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.16.14"
    // fabric-command-api-v2 for /randomdeathdrop reload and /rdd reload
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1"
}

processResources {
    filesMatching('fabric.mod.json') {
        expand "version": version
    }
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
