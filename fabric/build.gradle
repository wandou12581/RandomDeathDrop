plugins {
    id 'net.fabricmc.fabric-loom-remap' version "1.17.19"
    id 'maven-publish'
}

group = 'com.halfdrop'
version = '1.3.1'

base {
    archivesName = 'RandomDeathDrop-fabric'
}

// 共享源码：common/ 下的类由本模块直接编译进 jar（不走独立模块，避免 loom 跨模块依赖问题）
sourceSets.main.java.srcDirs += ['../common/src/main/java']

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.16.14"
    // 命令注册用 fabric-command-api-v2（/randomdeathdrop reload、/rdd reload）
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1"
}

processResources {
    filesMatching('fabric.mod.json') {
        expand "version": version
    }
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
