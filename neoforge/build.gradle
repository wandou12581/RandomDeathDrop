plugins {
    id 'net.neoforged.moddev' version '2.0.144'
}

group = 'com.halfdrop'
version = '1.4.0'

base {
    archivesName = 'RandomDeathDrop-neoforge'
}

// shared sources: compile common/ into this jar directly
sourceSets.main.java.srcDirs += ['../common/src/main/java']

neoForge {
    version = '21.1.249'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        halfdrop {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    filesMatching('META-INF/neoforge.mods.toml') {
        expand project.properties
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
