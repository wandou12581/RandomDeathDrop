pluginManagement {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        maven {
            url 'https://maven.neoforged.net/releases'
            content { includeGroupByRegex 'net\\.neoforged.*' }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'halfdrop'

include ':fabric'
include ':neoforge'
